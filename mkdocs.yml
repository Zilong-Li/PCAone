site_name: PCAone
site_description: >-
  Fast, memory-efficient principal component analysis of large datasets,
  with in-core and out-of-core algorithms.
site_author: Zilong Li
site_url: https://zilongli.org/PCAone/
# page.html URLs (not page/): zilongli.org proxies /PCAone/* to GitHub Pages, and
# Netlify's trailing-slash normalization would turn page/ into GitHub redirects
use_directory_urls: false
repo_url: https://github.com/Zilong-Li/PCAone
repo_name: Zilong-Li/PCAone
edit_uri: edit/main/docs/
copyright: Copyright &copy; Zilong Li. PCAone is released under GPL-3.0.

theme:
  name: material
  font:
    text: Open Sans
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # docs/index.md pulls in README.md and rewrites its relative links
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style heading anchors, so #links work on GitHub and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  requirements.txt

# docs/ layout, one folder per section below:
#   index.md, installation.md, changelog.md   top-level pages
#   guide/     reference shared by all analyses: options, input/output, methods
#   small-n/   analysis guides for up to a few thousand samples
#   biobank/   analysis guides for tens of thousands of samples or more
#   assets/    images, stylesheets and javascripts
#   guide/*.html, methods/*.html   static redirects from the old page URLs
# Each analysis guide ends with a "Method details" section. Developer notes
# live in dev/ at the repository root and are not published.
nav:
  - Home: index.md
  - Install: installation.md
  - User guide:
      - Options: guide/options.md
      - Input and output: guide/input-output.md
      - Choosing a PCA method: guide/pca.md
      - Plotting: guide/plotting.md
  - Small-N:
      - small-n/index.md
      - Exact PCA and EM-PCA: small-n/pca.md
      - Projection: small-n/projection.md
      - Selection scan: small-n/selection.md
      - HWE and inbreeding: small-n/hwe.md
      - Relatedness: small-n/relatedness.md
      - Ancestry-adjusted LD: small-n/ld.md
  - Biobank analysis:
      - biobank/index.md
      - Out-of-core PCA: biobank/pca.md
      - Projection: biobank/projection.md
      - LD pruning and clumping: biobank/ld.md
      - Relatedness: biobank/relatedness.md
      - Plotting large cohorts: biobank/plotting.md
  - Change log: changelog.md
